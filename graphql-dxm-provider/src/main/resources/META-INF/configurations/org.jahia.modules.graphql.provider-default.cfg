# default configuration - won't be overriden
#
# Config file for GraphQL dxm provider.
#

#
# List of permissions to be checked for specific GraphQL types and fields.
# Format is like: permission.{TYPE}.{FIELD} = {PERMISSION}
# Where:
#   {TYPE}:         is the GraphQL type ( ex: Query, JCRNode, GenericJCRNode, etc.. )
#                   Inheritance is possible between types ( ex: GenericJCRNode inherit of all JCRNode permission properties ),
#                   unless GenericJCRNode redefine permission properties for some specific fields.
#                   example of inheritance and override:
#
#                   permission.JCRNode.* = graphQlNodeReadPermission
#                   permission.GenericJCRNode.getSite = graphQlSiteReadPermission
#
#   {FIELD}:        is the GraphQL field from the previous type, wildcard is allowed if you want to restrict access
#                   to all the fields of a specific type. Combination of named field and wildcard is possible, a named field
#                   will always override the wildcard permission.
#                   For example, if we want to restrict all the Query type fields using one permission for all the fields, and
#                   a different permission for a specific field:
#
#                   permission.Query.* = graphQLQueryAccessPermission
#                   permission.Query.getNodesByPath = graphQLNodesByPathPermission
#
#   {PERMISSION}:   is the permission name that will be use to check the access to previously defined type and field(s)
#                   permissions are always checked on the root JCR node.
#
# permission.JCRQuery.* = jcr:read
#
#
# List of allowed origin for CORS access :
#
# http.cors.allow-origin=http://mysite1.com, http://mysite2.com

# Maximum number of nodes a single connection (paginated field) may collect. Set 0 to disable the cap.
graphql.fields.node.limit = 5000

# Maximum number of nodes ONE REQUEST may walk across all of its fields together, as opposed to the per-connection cap
# above. Read only from this default configuration file, like the other limits below, so that a third-party module
# cannot loosen it.
#
# The two are not interchangeable. graphql.fields.node.limit caps each connection on its own and says nothing about how
# many connections a request may open, whereas a nested selection opens one inner connection per node the outer one
# returns. Set 0 to disable the bound.
#
# Note that a connection's totalCount is computed by reading every item the connection matches, however small the
# requested page, and those reads are charged like any other: selecting totalCount over a result set larger than this
# limit is the most likely way for a legitimate client to reach it. Such clients should omit totalCount where the
# total is not actually shown; deployments that need large counts can raise the limit.
graphql.fields.node.requestLimit = 20000

# Query-cost guards (defence against amplification / DoS).
# The graphql-java parser caps (grammar depth, token count) only bound the textual shape of a document, not the work
# it triggers: a query can stay under those caps yet still expand into thousands of resolver invocations. The guards
# below reject such documents *before* execution (before any field is fetched, permission-checked or serialized).
# All three are read only from this default configuration file so that a third-party module cannot loosen them. A
# single analysis of the document feeds the first two, so enabling the second costs no extra work per request, and the
# third is measured only once a document has passed them.
#
# graphql.query.maxComplexity: maximum complexity of a query, where every field counts as 1 plus the complexity of
#   its sub-selection (e.g. a query aliasing a single scalar 4000 times has a complexity of 4000). A query whose total
#   complexity exceeds this value is rejected. Aliases count individually, and so do meta fields such as __typename:
#   each one still costs a permission check and, when denied, an error object in the response.
# graphql.query.maxDepth: maximum nesting depth of a query, counting every field (defence in depth, complements the
#   complexity guard).
# graphql.query.maxExpandedFields: maximum number of fields a query executes once every fragment is expanded at each
#   place it is spread. The two guards above read the document as written, in which a fragment is one definition
#   however many spreads point at it; execution expands it at every spread, so the fields that run are counted
#   separately, from the operation graphql-java builds for execution. That build stops at the limit, so measuring
#   costs at most the limit however far a query would expand. A query over it is refused with
#   "Maximum field count exceeded. N > M", where N is where the count stopped, one past the limit. Aliases and meta
#   fields count as they do for the complexity guard, and two selections of one field under one response key count
#   once, as they execute once.
#
# Neither guard bounds how far a query's list fields fan out, which is the dimension along which cost multiplies
# rather than adds: a list nested inside a list is evaluated once per item of the outer one, so
# descendants { nodes { descendants { nodes { ... } } } } can stand for millions of JCR reads while staying textually
# small and shallow. Neither guard CAN bound it, because bounding it before execution would need a per-field notion of
# how many items a field can return, which the schema does not carry: nodeTypes { nodes { extends { nodes } } } is the
# same shape over connections with the same arguments, yet it reads a few hundred node type definitions out of an
# in-memory registry rather than millions of nodes. Any threshold that rejected the second would reject the first.
# Fan-out is therefore bounded as it happens rather than in advance, by graphql.fields.node.requestLimit above, which
# counts the nodes a request actually reads - a measure that tells those two documents apart precisely because it does
# not have to predict them.
#
# Mutation fields are bounded on a third axis again — how many nodes one request may ask them to operate on — by
# graphql.mutation.batch.limit below. That is a property of the arguments a field is handed rather than of the
# document's shape, so it is measured and bounded separately from the two guards above.
#
# Set 0 on any of these properties to disable that specific guard. The values below are enabled by default: they are
# wide enough to pass legitimate traffic (schema introspection, jContent/page-composer queries) with headroom, while
# rejecting pathological amplification and deeply-nested documents. Raise them per deployment if a legitimate query
# is ever rejected (the error message reports the measured value vs. the limit), or set 0 to opt out entirely.
graphql.query.maxComplexity = 2000
graphql.query.maxDepth = 30
graphql.query.maxExpandedFields = 2000

# Maximum number of nodes ONE REQUEST may ask its mutations to operate on, whether it names them or matches them with
# a query. Read only from this default configuration file, like the guards above, so a third-party module cannot loosen
# it.
#
# This is deliberately a SEPARATE dial from graphql.fields.node.limit: that one caps how many nodes a read field
# collects and serializes, whereas a mutation batch accumulates pending changes in one JCR session written in a single
# commit, so the two want to be tunable independently. It is also distinct from the query-cost guards above, which
# measure the shape of a document rather than how many items its arguments carry.
#
# A request that asks for more than the bound FAILS; it is never trimmed down to the bound. Partially mutating the
# nodes a caller asked for would leave them half-changed with nothing in the response to say so, so an oversized
# request is a bad request. Nothing is persisted when it fails: the JCR session is only saved once the whole request
# completes without errors.
#
# Enumerated batches (mutateNodes, addNodesBatch) state their size in their arguments, so they are measured across the
# whole document and refused before execution - which is also what stops the bound being multiplied by aliasing the
# same mutation, or by burying items inside a recursive input type such as InputJCRNode.children. mutateNodesByQuery
# also states its size in an argument when it is given a limit, and that limit is refused against this same value. The
# difference is where the two are measured: an enumerated batch is summed across the document, whereas a limit is
# checked per field, because without one how many nodes a JCR-SQL2 statement matches is not known until it runs. What
# a document asks for in total is bounded as it executes instead, by the allowance described next.
#
# A limit no wider than this value is therefore a legal request on its own, and is the way to work through a large
# result set. How much of it one request can actually take is a second question: the value below is the budget for the
# WHOLE request. Every argument that hands a mutation nodes to write draws on it, which is more than the two fields
# above: also addNode and addChild children, addChildrenBatch, copyNodes, moveNodes, mutateVanityUrls, and any batch
# mutation a module contributes. So does mutateNodesByQuery, as it runs. A page can therefore still be refused once the
# rest of the document has claimed the room for it. Pages spread over separate requests each get the full budget.
#
# Set 0 to disable the bound. The value below matches graphql.fields.node.limit so that introducing this property is
# not itself a change of behaviour; it is expected to be lowered once there is data on real batch sizes.
graphql.mutation.batch.limit = 5000

# Maximum number of operations ONE REQUEST may submit. Read only from this default configuration file, like the limits
# above, so a third-party module cannot loosen it.
#
# The endpoint accepts a JSON array as a request body, each element of which is an independent operation with its own
# document and variables, all of them executed as part of the one request. This bound counts those elements, and it is
# a different measure from every limit above, which describe one operation each: the complexity and depth ceilings are
# applied to each operation on its own, and each operation opens its own node and mutation batch allowance. So this is
# the factor the others are multiplied by, which is the reason to keep it tight - a request may ask for as much work as
# this many operations at the full ceilings, whatever the ceilings are set to.
#
# A request that submits more FAILS as a whole; it is never trimmed down to the bound. The caller submitted a set of
# operations and expects an answer for each, so answering some of them would silently not do what was asked. The
# response reports how many were submitted and what the maximum is.
#
# The value below leaves room for the clients that batch legitimately - the widely used ones default to ten operations
# per request - and Jahia's own interfaces send one operation per request, so they are unaffected by any value from 1
# up. Set 0 to disable the bound.
graphql.request.operationLimit = 20

# Controls access to GraphQL introspection queries (requires graphql-dxm-provider >= 3.5.0)
# Behavior:
#   - Multiple configuration files may define this property.
#   - If ANY configuration file sets introspectionCheckEnabled=true, the feature is considered enabled globally.
# When enabled (true):
#   - Introspection queries are restricted to users having the permission: developerToolsAccess.
# When disabled (false):
#   - Introspection queries are allowed for all users with no permission checks.
# Default: true (secure). The check is on unless a configuration explicitly sets it to false; an empty or
# unrecognized value is treated as true (enabled) and logged, so a typo cannot silently open introspection.
# To open introspection to everyone, set this property to false here (in the default configuration file).
introspectionCheckEnabled=true
